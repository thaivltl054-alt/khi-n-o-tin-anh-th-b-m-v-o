<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đi chơi với anh nhé 💕</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { background: #fff3e0; font-family: Arial, sans-serif; text-align: center; margin-top: 50px; padding: 10px; }
        h1 { color: #e57373; font-size: 24px; }
        button { padding: 12px 24px; font-size: 20px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .slide { display: none; }
        .slide.active { display: block; }
        #yes { background: #66bb6a; color: white; position: relative; z-index: 100; }
        #no { background: #ef5350; color: white; margin-left: 20px; }
        .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .option { cursor: pointer; text-align: center; width: 160px; border: 3px solid transparent; border-radius: 15px; padding: 10px; transition: 0.3s; }
        .option img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 5px solid #f2b6b6; pointer-events: none; }
        .option.selected { border-color: #ff6b6b !important; background: #ffebee !important; transform: scale(1.05); }
        .option p { margin: 8px 0 2px 0; color: #d77; font-weight: bold; pointer-events: none; }
        .option small { display: block; font-size: 11px; color: #d48ca1; line-height: 1.3; pointer-events: none; }
        input { color: #a9446a; background: #fff7f7; border: 2px solid #f2b6b6; padding:12px; width:260px; border-radius:10px; font-size:16px; outline:none; }
        .slide button:not(#yes):not(#no) { background: #f7caca; color: #a9446a; margin-top: 20px;}
    </style>
</head>
<body>
<div id="app"></div>
<script>
    (function(){ emailjs.init("9ZG74AdaCznDBmeqH"); })();

        /* 1 */ `<h1>Then kiuuu 💖💖💖</h1><img src="https://media4.giphy.com/media/icIr8rk03xQI6NS67S/giphy.gif" width="200"><br><br><button onclick="nextSlide()">Ấn ở đây nè Na 👉</button>`,
        /* 2 */ `<h1>Chọn ngày đi chơi nè 🗓️</h1><input type="date" id="dateInput"><br><br><button onclick="saveDate()">Tiếp theo 👉</button>`,

                <p>La Yen</p>
                <small>Nhà nhiều đánh giá tốt nhưng anh chưa đi thử</small>
            </div>
            <a href="https://www.tiktok.com/@chuthudanang/video/7567712294415666453" target="_blank" style="display:inline-block; margin-top:5px; color:#d62828; font-weight:bold; text-decoration:underline;">Xem clip 🎬</a>
        </div>

        <!-- Quán 3: Miền dâu dại -->
        <div style="text-align: center;">
            <div class="option" onclick="handleSelect(this, 'quan_cafe', 'Miền dâu dại')">
                <img src="https://scontent.fhan14-5.fna.fbcdn.net/v/t39.30808-6/687935345_942566021962787_7686991622432254148_n.jpg?stp=dst-jpg_tt6&cstp=mx1254x1254&ctp=s1254x1254&_nc_cat=109&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeEIUN4wzwP0jgsPCgRl8943OpLKVc1FFp06kspVzUUWnVtqQ7AL0dpjYFEa3Qe3VeCSxM19rdqsV6tjfwtdm54b&_nc_ohc=b0FOUgmtvfkQ7kNvwER44jG&_nc_oc=Adqk7TAavmH3i8zUsKnwTcWO51yx3rvBdN93nqgsvs85YktHtZshQ19c6-MREJFa5HjyKd85xrooWndgKRwzkLvy&_nc_zt=23&_nc_ht=scontent.fhan14-5.fna&_nc_gid=G3m6DLoyi5qnGzKVwVThhQ&_nc_ss=7b2a8&oh=00_AQNsNuCThaRn8UxYsAYT-HMeXBbLiPJK0XRcxwZXhW6ciw&oe=6AC1BDD4">

                <p>A-Kopi</p>
                <small>Quán đẹp nhưng đông khách và anh cũng chưa đi thử</small>
            </div>
            <a href="https://www.tiktok.com/@ig_ttlthuong/video/7333582853793516808" target="_blank" style="display:inline-block; margin-top:5px; color:#d62828; font-weight:bold; text-decoration:underline;">Xem clip 🎬</a>
        </div>
    </div>
</div>
                <br><button onclick="nextSlide()">Tiếp theo 👉</button>`,
        /* 5 */ `<h1>Nếu có tăng 2 Em muốn đi đâuuu 💕</h1>
                <div class="options">
                    <div class="option" onclick="handleSelect(this, 'tang_2', 'Dạo biển')"><img src="https://www.dongtayxanh.com/CustomFolder/images/bien-my-khe-dem.png"><p>Dạo biển</p></div>
                    <div class="option" onclick="handleSelect(this, 'tang_2', 'Ăn vặt')"><img src="https://acfood.vn/image/catalog/0443.png"><p>Ăn vặt</p></div>
                    <div class="option" onclick="handleSelect(this, 'tang_2', 'Xem phim')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmkDrKFiLjsv41RVfNUiMSVQkn99ZfngKI3WSDlzD9bbRNp0elkbGsO28&s=10"><p>Xem phim</p></div>
                     <div class="option" onclick="handleSelect(this, 'tang_2', 'Music box')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN_APEfaAeWEtg0dmLfX2iVpUWu17wOjIzTu0hUkWrw3v3sJYarcXqqusa&s=10"><p>Music box</p></div>
                      <div class="option" onclick="handleSelect(this, 'tang_2', 'Ngắm ĐN từ Sơn Trà')"><img src="https://media-cdn-v2.laodong.vn/storage/newsportal/2025/10/6/1586894/Rsz_1525587974_14839.jpg"><p>Ngắm ĐN từ Sơn Trà</p></div>
                </div><br><button onclick="sendEmail()">Gửi cho anh 💖</button>`,
        /* 6 */ `<div id="finalMessage"><h1>Đang gửi lựa chọn... 💌</h1></div>`
    ];

    function renderSlide() { 
        document.getElementById("app").innerHTML = `<div class="slide active">${slides[slideIndex]}</div>`;
        if (slideIndex === 0) {
            const y = document.getElementById("yes"); const n = document.getElementById("no");
            y.onclick = nextSlide;
            n.onclick = () => { yesSize += 35; y.style.fontSize = yesSize + "px"; y.style.padding = (yesSize/2) + "px " + yesSize + "px"; };
        }
    }
    function nextSlide() { slideIndex++; renderSlide(); }
    function saveDate() { userSelection.ngay_di = document.getElementById("dateInput").value; if(!userSelection.ngay_di) return alert("Chọn ngày đã nè!"); nextSlide(); }
    function saveAddress() { userSelection.dia_chi = document.getElementById("addressInput").value; if(!userSelection.dia_chi) return alert("Nhập địa chỉ đã nè!"); nextSlide(); }
    
    function handleSelect(el, key, value) {
        const options = el.parentElement.querySelectorAll(".option");
        options.forEach(o => o.classList.remove("selected"));
        el.classList.add("selected");
        userSelection[key] = value;
    }

    function sendEmail() {
        slideIndex++; renderSlide();
        emailjs.send("service_q3rxy3r", "template_tuprd16", userSelection)
        .then(() => {
            document.getElementById("finalMessage").innerHTML = `<h1>Hẹn em hôm đó nhaaaa 💕🥰</h1><img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" width="250">`;
        }, (err) => {
            alert("Lỗi: " + err.text);
        });
    }
    renderSlide();
</script>
</body>
</html>
